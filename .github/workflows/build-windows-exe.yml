name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        shell: bash

      - name: Build app
        run: ./gradlew build installDist
        shell: bash

      - name: Show installDist output
        run: |
          Get-ChildItem -Recurse frontend/build/install
        shell: pwsh

      - name: Build EXE with jpackage
        run: |
          jpackage `
          --type exe `
          --name DobriyShkafApp `
          --input frontend/build/install/frontend/lib `
          --main-jar frontend.jar `
          --main-class MainKt `
          --dest build/jpackage
        shell: pwsh

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DatabaseApp-Windows-EXE
          path: build/jpackage/*.exe
